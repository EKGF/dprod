name: build-and-deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# The spec is published via the Vercel site (ekgf.org/dprod); the former
# GitHub Pages deployment is retired. This workflow only verifies that the
# spec generator still builds.
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: false
  
jobs:
  build:
    runs-on: macos-latest    
    steps:
      - name: Debug - Show event info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies and run generator
        run: |
          echo "Installing dependencies..."
          pip install -r requirements.txt
          echo "Running spec generator..."
          python spec-generator/main.py