name: build-and-deploy

# The spec is published via the Vercel site (ekgf.org/dprod); the former
# GitHub Pages deployment is retired. This workflow only verifies that the
# repository policy holds and the spec generator still builds.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest    
    permissions:
      contents: read
    steps:
      - name: Debug - Show event info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Runs after the install because the example validation needs rdflib and
      # pyld. Before issue #246 this step ran first and could only cover tests
      # with no third-party imports, which is part of why nothing ever parsed
      # the JSON-LD examples.
      - name: Enforce repository policy and validate examples
        run: python -m unittest discover -s tests
      - name: Run contracts tests
        run: python -m unittest discover -s dprod-contracts/tests
      - name: Run spec generator
        run: python spec-generator/main.py
