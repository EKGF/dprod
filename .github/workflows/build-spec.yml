name: build-and-deploy

# The spec is published via the Vercel site (ekgf.org/dprod); the former
# GitHub Pages deployment is retired. This workflow only verifies that the
# repository policy holds and the spec generator still builds.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest    
    permissions:
      contents: read
    steps:
      - name: Debug - Show event info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies
      - name: Enforce repository policy
        run: python -m unittest discover -s tests
      - name: Install dependencies and run generator
        run: |
          echo "Installing dependencies..."
          pip install -r requirements.txt
          echo "Running contracts tests..."
          python -m unittest discover -s dprod-contracts/tests
          echo "Validating contracts examples against SHACL shapes..."
          python dprod-contracts/validate.py
          echo "Running spec generator..."
          python spec-generator/main.py
