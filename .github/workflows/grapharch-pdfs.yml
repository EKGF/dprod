name: GraphArch PDF editions

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: grapharch-pdfs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin a reviewed GraphArch implementation until the next binary release.
  GRAPHARCH_COMMIT: 0ed66009257dd9c40362cf5427abeb385db7fa06

jobs:
  editions:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact DPROD source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check out the pinned GraphArch generator
        uses: actions/checkout@v7
        with:
          repository: EKGF/grapharch
          ref: ${{ env.GRAPHARCH_COMMIT }}
          path: .grapharch-tool
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: .grapharch-tool
      - name: Install native compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config libssl-dev
      - name: Build the pinned generator
        working-directory: .grapharch-tool
        run: cargo build --locked --release --bin grapharch
      - name: Reuse the bare source repository cache
        uses: actions/cache@v6
        with:
          path: output/grapharch-input/output/cache/git
          key: dprod-grapharch-git-${{ runner.os }}-${{ github.sha }}
          restore-keys: dprod-grapharch-git-${{ runner.os }}-
      - name: Generate both editions from this exact Git commit
        run: >-
          python3 scripts/grapharch_editions.py
          --grapharch .grapharch-tool/target/release/grapharch
          --source-revision "$GITHUB_SHA"
          --grapharch-revision "$GRAPHARCH_COMMIT"
          --output output/grapharch-editions
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the existing specification generator dependencies
        run: pip install -r requirements.txt
      - name: Preserve the existing specification publication
        run: python spec-generator/main.py
      - name: Generate the source-owned project website preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .grapharch-tool/target/release/grapharch publication build-site
          --source publication/project-site
          --definitions publication/project-site.ttl
          --project urn:dprod:project-site
          --target urn:dprod:project-site:website
          --output-root output/grapharch-project-site
      - name: Package the project website and preserved specifications
        run: >-
          .grapharch-tool/target/release/grapharch publication package-site
          --config publication/hosting.yml
          --output-root .
      - name: Verify frozen specification bytes were preserved
        run: |
          if diff --recursive --brief site/public/spec/archive .vercel/output/static/dprod/spec/archive; then
            printf 'Frozen specification archive preserved byte for byte\n'
          else
            printf 'Frozen specification archive changed during packaging\n' >&2
            exit 1
          fi
          if diff --recursive --brief site/public/spec/archive/1.0 .vercel/output/static/dprod/spec/main; then
            printf 'Main specification alias preserves the frozen release\n'
          else
            printf 'Main specification alias differs from the frozen release\n' >&2
            exit 1
          fi
      - name: Retain the portable static deployment
        uses: actions/upload-artifact@v6
        with:
          name: dprod-static-deployment-${{ github.sha }}
          path: .vercel/output/
          include-hidden-files: true
          if-no-files-found: error
      - name: Deploy a reviewable static preview
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if npx --yes vercel@54.21.1 deploy --prebuilt --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" > .vercel/preview-url.txt; then
            if preview_url="$(cat .vercel/preview-url.txt)"; then :; else exit 1; fi
            if printf 'Static preview: %s/dprod/\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"; then :; else exit 1; fi
          else
            printf 'Static preview deployment failed\n' >&2
            exit 1
          fi
      - name: Verify the deployed preview routes
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if preview_url="$(cat .vercel/preview-url.txt)"; then :; else exit 1; fi
          if mkdir .vercel/smoke; then :; else exit 1; fi
          for route in /dprod/ /dprod/why/ /dprod/concepts/ /dprod/adopt/ /dprod/roadmap/ /dprod/spec-versions/ /dprod/spec/ /dprod/spec/main/ /dprod/spec/develop/ /dprod/spec/archive/1.0 /dprod/spec/contracts/profile/ /dprod/spec/develop/contracts/profile/ /dprod/spec/main/assets/DPROD.drawio.svg /dprod/spec/develop/assets/DPROD.drawio.svg; do
            if name="$(printf '%s' "$route" | tr '/.' '__')"; then :; else exit 1; fi
            if npx --yes vercel@54.21.1 curl "$route" --deployment "$preview_url" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" -- --fail --silent --show-error --write-out '%{http_code} %{content_type}\n' --output ".vercel/smoke/$name.body" > ".vercel/smoke/$name.meta"; then
              printf 'Verified %s\n' "$route"
            else
              printf 'Preview route failed: %s\n' "$route" >&2
              exit 1
            fi
          done
          if cmp dprod-contracts/dprod-contracts-prof.ttl .vercel/smoke/_dprod_spec_contracts_profile_.body; then :; else
            printf 'Profile IRI did not return the exact RDF artifact\n' >&2
            exit 1
          fi
      - name: Retain deployed preview evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dprod-static-http-${{ github.sha }}
          path: .vercel/smoke/
          if-no-files-found: warn
      - name: Retain the preview deployment address
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dprod-static-preview-${{ github.sha }}
          path: .vercel/preview-url.txt
          if-no-files-found: warn
      - name: Retain the static project website preview
        uses: actions/upload-artifact@v6
        with:
          name: dprod-project-website-${{ github.sha }}
          path: output/grapharch-project-site/site/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain the EKGF community edition
        uses: actions/upload-artifact@v6
        with:
          name: dprod-ekgf-community-${{ github.sha }}
          path: output/grapharch-editions/ekgf-community/
          if-no-files-found: error
      - name: Retain the OMG submission preview
        uses: actions/upload-artifact@v6
        with:
          name: dprod-omg-submission-preview-${{ github.sha }}
          path: output/grapharch-editions/omg-submission-preview/
          if-no-files-found: error
      - name: Retain machine-readable build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dprod-grapharch-evidence-${{ github.sha }}
          path: |
            output/grapharch-project-site/documentation.nq
            output/grapharch-editions/report.json
            output/grapharch-editions/build-provenance.json
            output/grapharch-editions/artifacts/dprod/documentation.nq
          if-no-files-found: warn
