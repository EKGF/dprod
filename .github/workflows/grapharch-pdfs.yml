name: GraphArch publications

# All executable publication code comes from the leading branch. Other refs
# contribute Git blobs only. PR build scripts and dependency manifests never run.
on:
  push:
    branches: [develop]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_run:
    workflows: [build-and-deploy]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: grapharch-central-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || github.event.workflow_run.head_branch == 'develop') && github.run_id || 'publications' }}
  cancel-in-progress: true

jobs:
  assemble:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'develop')
    runs-on: ubuntu-latest
    outputs:
      config_revision: ${{ steps.config.outputs.revision }}
    steps:
      - name: Check out trusted leading-branch orchestration
        uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false
      - name: Resolve the single source-owned generator pin
        id: config
        run: |
          if revision="$(git rev-parse HEAD)"; then :; else exit 1; fi
          if printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"; then :; else exit 1; fi
          if generator="$(python3 -c 'import json; print(json.load(open("publication/publications.json"))["generator_revision"])')"; then :; else exit 1; fi
          if printf 'generator=%s\n' "$generator" >> "$GITHUB_OUTPUT"; then :; else exit 1; fi
          if version="$(python3 -c 'import json; print(json.load(open("publication/publications.json"))["generator_version"])')"; then :; else exit 1; fi
          if printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"; then :; else exit 1; fi
      - name: Check out the one reviewed GraphArch generator
        uses: actions/checkout@v7
        with:
          repository: EKGF/grapharch
          ref: ${{ steps.config.outputs.generator }}
          path: .grapharch-tool
          persist-credentials: false
      - name: Install the verified published generator
        id: grapharch
        uses: ./.grapharch-tool
        with:
          mode: install
          version: ${{ steps.config.outputs.version }}
          expected-revision: ${{ steps.config.outputs.generator }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install trusted source serialization dependencies
        run: pip install -r requirements.txt
      - name: Validate central publication selection and isolation
        run: python -m unittest discover -s tests -p 'test_*grapharch*.py'
      - name: Validate the central assembly contract
        run: python -m unittest discover -s tests -p test_central_publications.py
      - name: Rebuild every selected publication and assemble one complete site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/central_publications.py
          --manifest publication/publications.json
          --grapharch "${{ steps.grapharch.outputs.binary-path }}"
          --output output/central-publications
      - name: Retain the complete portable publication
        uses: actions/upload-artifact@v6
        with:
          name: dprod-static-deployment-${{ github.run_id }}
          path: output/central-publications/deployment/.vercel/output/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain all source graphs, PDFs and build evidence
        uses: actions/upload-artifact@v6
        with:
          name: dprod-publication-evidence-${{ github.run_id }}
          path: |
            output/central-publications/publications/
            output/central-publications/website/
            output/central-publications/publication-build.json
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact trusted publication revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.assemble.outputs.config_revision }}
          persist-credentials: false
      - name: Download this run's fully assembled site
        uses: actions/download-artifact@v7
        with:
          name: dprod-static-deployment-${{ github.run_id }}
          path: .vercel/output
      - name: Deploy a reviewable static preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if npx --yes vercel@54.21.1 deploy --prebuilt --yes --scope "$VERCEL_ORG_ID" > .vercel/preview-url.txt; then
            if preview_url="$(cat .vercel/preview-url.txt)"; then :; else exit 1; fi
            if printf 'Complete publication preview: %s/dprod/\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"; then :; else exit 1; fi
          else
            printf 'Static preview deployment failed\n' >&2
            exit 1
          fi
      - name: Verify every deployed publication from its build record
        run: |
          if preview_url="$(cat .vercel/preview-url.txt)"; then :; else exit 1; fi
          if python3 scripts/verify_publication_site.py --base-url "$preview_url" --record .vercel/output/static/dprod/publication-build.json; then :; else exit 1; fi
      - name: Retain the preview deployment address
        uses: actions/upload-artifact@v6
        with:
          name: dprod-static-preview-${{ github.run_id }}
          path: .vercel/preview-url.txt
          if-no-files-found: error
