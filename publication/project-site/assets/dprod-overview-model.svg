<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Four connected parts of a data product description</title>
<desc id="desc">Products connect to data services through ports and to datasets. Datasets have distributions accessed through services.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#182b35}.title{font-weight:700;font-size:27px}.relation{font-size:17px;fill:#4949b5}.number{font-size:16px;font-weight:700;fill:#4949b5}</style></defs>
<rect x="5" y="5" width="950" height="290" rx="28" fill="#f5f5fc"/>
<g fill="none" stroke="#9595cf" stroke-width="3"><path d="M420 75H540"/><path d="M230 125V175"/><path d="M730 125V175"/><path d="M420 225H540"/></g>
<g fill="#fff" stroke="#d9d9ec" stroke-width="2"><rect x="40" y="25" width="380" height="100" rx="18"/><rect x="540" y="25" width="380" height="100" rx="18"/><rect x="40" y="175" width="380" height="100" rx="18"/><rect x="540" y="175" width="380" height="100" rx="18"/></g>
<text x="65" y="58" class="number">01 PRODUCT</text><text x="65" y="95" class="title">What is it for?</text>
<text x="565" y="58" class="number">02 DATA SERVICE</text><text x="565" y="95" class="title">How do I exchange it?</text>
<text x="65" y="208" class="number">03 DATASET</text><text x="65" y="245" class="title">What does it mean?</text>
<text x="565" y="208" class="number">04 DISTRIBUTION</text><text x="565" y="245" class="title">In which form?</text>
<text x="480" y="65" class="relation" text-anchor="middle">ports</text><text x="242" y="156" class="relation">datasets</text><text x="742" y="156" class="relation">access</text><text x="480" y="215" class="relation" text-anchor="middle">forms</text>
</svg>
