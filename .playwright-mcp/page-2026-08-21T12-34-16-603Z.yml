      - paragraph [ref=f1e823]: Example of a data product for Equity Trades.
      - paragraph [ref=f1e824]: "The Equity Trades Data Product provides two datasets to the consumers: one for trades in London Stock Exchange (LSEG) and one in Euronext."
      - paragraph
      - code [ref=f1e826]: "{ \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"id\": \"equity trade-xxx\", \"@id\": \"https://y.com/products/equity-trade-xxx\", \"@type\": \"DataProduct\", \"title\": \"Equity Trade XXX\", \"description\": \"Trade data defining the outcome of equity trades between parties in different stock markets, where the terms are primarily reflected in the tradable product. Additionally, Trade includes attributes such as the trade date, transacting parties, and settlement terms. Some attributes, such as the parties, are already defined in the Party Product and are simply referenced in Trade\", \"dataProductOwner\": \"https://www.schema.xxx/person/AnnTaylor\", \"lifecycle\" : \"Consume\", \"outputPort\": [{ \"@type\": \"dcat:DataService\", \"id\": \"equity-trade-euronext-xxx-tabular-adls-prod\", \"@id\": \"https://y.com/service/equity-trade-euronext-xxx-adls-prod-1\", \"dcat:endpointURL\": \"abfss://datasetsv1@demo.dfs.core.windows.net/demo/full/trade-euronext\", \"dcat:endpointDescription\": \"Details for accessing storage account\", \"isAccessServiceOf\": { \"@id\": \"https://y.com/service/equity-trade-euronext-xxx-tabular\", \"id\": \"equity-trade-euronext-xxx-tabular\", \"@type\": \"dcat:Distribution\", \"dcterms:format\": \"application/parquet\", \"dcat:conformsTo\": \"https://cdm.finos.org/docs/event-model\" , \"isDistributionOf\": { \"@type\": \"dcat:Dataset\", \"@id\": \"https://y.com/dataset/equity-trade-euronext-paris\", \"datasetOwner\": \"https://www.schema.xxx/person/JohnBarks\", \"title\": \"Equity Trade Euronext Paris XXX\", \"id\": \"equity-trade-euronext-paris-xxx\", \"dcat:conformsTo\": \"https://cdm.finos.org/docs/event-model\" } } } ,{ \"@type\": \"dcat:DataService\", \"id\": \"equity-trade-lseg-xxx-tabular-adls-prod\", \"@id\": \"https://y.com/service/equity-trade-lseg-xxx-adls-prod-1\", \"dcat:endpointURL\": \"abfss://datasetsv1@demo.dfs.core.windows.net/demo/full/trade-lseg\", \"dcat:endpointDescription\": \"Details for accessing storage account\", \"isAccessServiceOf\": { \"@id\": \"https://y.com/service/equity-trade-lseg-xxx-tabular\", \"id\": \"equity-trade-lseg-xxx-tabular\", \"@type\": \"dcat:Distribution\", \"dcterms:format\": \"application/parquet\", \"dcat:conformsTo\": \"https://cdm.finos.org/docs/event-model\" , \"isDistributionOf\": { \"@type\": \"dcat:Dataset\", \"@id\": \"https://y.com/dataset/equity-trade-lseg-xxx\", \"title\": \"Equity Trade LSEG XXX\", \"id\": \"equity-trade-lseg-xxx\", \"dcat:conformsTo\": \"https://cdm.finos.org/docs/event-model\" } } } ] }"
    - generic [ref=f1e827]:
      - heading "Data Rights" [level=3] [ref=f1e828]
      - paragraph
      - paragraph [ref=f1e829]:
        - link "ODRL" [ref=f1e830] [cursor=pointer]:
          - /url: https://www.w3.org/TR/odrl-model/
        - text: is a W3C standard to describe rights and entitlements. Based on ODRL, data product and dataset publishers can describe policies in a consistent, standard and machine-readable manner. Policies contain permissions and prohibitions on specific actions that are required to be met by stakeholders.
      - paragraph [ref=f1e831]: In addition, policies may be limited by constraints (eg. temporal or geographical constraints) and duties (eg. payments) that may be imposed on the permissions.
      - paragraph [ref=f1e832]: Policies and their permitted or prohibited actions can be described at different levels, eg. a policy can target a data product, a dataset, a data service or even a column.
      - paragraph [ref=f1e833]: "Sophisticated engines should interpret and enforce the ODRL policies at the appropriate level eg.:"
      - code [ref=f1e835]: examplePolicyA odrl:targets exampleProduct:ProductA . examplePolicyB odrl:targets exampleDataset:DatasetA1 .
      - paragraph [ref=f1e836]: "An example of a policy follows, that describes permission to distribute the data only within a specific geographic region:"
      - code [ref=f1e838]: "examplePolicyA odrl:permission { \"action\": \"odrl:distribute\", \"constraint\": [ {\"leftOperand\": \"region\", \"operator\": \"eq\", \"rightOperator\": \"region:EMEA\" } ] }"
      - paragraph
      - code [ref=f1e840]: "{ \"@type\": \"Policy\", \"id\": \"56456df-dfg-34535345-5545\", \"assigner\": 'https://schema.org/person/AdamSmith\", \"target\": \"https://data.org/data-product/equity-trade-xxx\", \"permission\": [ { \"action\": \"odrl:read\", \"constraint\": [ { \"@type\": \"Constraint\", \"leftOperand\": \"spatial\", \"operator\": \"odrl:isAnyOf\", \"rightOperand\": [region:EMEA, region:APAC], \"description\": \" Permission to read all the datasets of the product if user is working inside EMEA or APAC\" } ] }"
    - generic [ref=f1e841]:
      - heading "Observability Ports" [level=3] [ref=f1e842]
      - paragraph
      - paragraph [ref=f1e843]: An Observability Port is a designated interface or endpoint in a system or application specifically used for monitoring and diagnostic purposes. It allows external tools or services to collect and analyze data related to the system's performance, health, and behaviour. By exposing metrics, logs, and traces through this port, administrators and developers can gain insights into the system's state, troubleshoot issues, and ensure it operates efficiently and reliably.
      - heading "Defining Observability Ports in DPROD" [level=2] [ref=f1e844]
      - paragraph [ref=f1e845]: DPROD has a schema-first design. The first thing to do is define a schema for the logging information. It could be a schema based on OpenTelemetry, but this uses RLOG (which is a semantic ontology for logging).
      - paragraph [ref=f1e846]:
        - text: To find the Observability Port, query the ports to identify the ones that return an
        - code [ref=f1e847]: RLOG:Entry
        - text: ":"
      - code [ref=f1e849]: outputPort >> isAccessServiceOf >> isDistributionOf >> conformsTo >> rlog:Entry
      - heading "Example Data Product with Observability Port" [level=2] [ref=f1e850]
      - paragraph [ref=f1e851]:
        - text: "One can see that the example data product has two ports, one with the data and one with the logging. This query will return the URI of the port that returns logging data:"
        - code [ref=f1e852]: https://y.com/uk-bonds/observability-port
        - text: .
      - paragraph [ref=f1e853]: "Here is an example of a data product with an observability port:"
      - code [ref=f1e855]: "{ \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"dataProducts\": [ { \"id\": \"https://y.com/data-product/uk-bonds\", \"type\": \"DataProduct\", \"inputPort\": [ { \"id\": \"https://y.com/data-product/uk-bonds/port/2024-data\", \"type\": \"DataService\" } ], \"outputPort\": [ { \"id\": \"https://y.com/data-product/uk-bonds/port/2024-observability\", \"type\": \"DataService\", \"label\": \"Observability Port\", \"endpointURL\": \"https://y.com/data-product/uk-bonds/port/2024-observability\", \"isAccessServiceOf\": { \"type\": \"Distribution\", \"format\": \"https://www.iana.org/assignments/media-types/application/json\", \"isDistributionOf\": { \"type\": \"Dataset\", \"id\": \"https://y.com/data-product/uk-bonds/dataset/2024-observability\", \"conformsTo\": \"https://y.com/schema/ObservabilityLog\" } } }, { \"id\": \"https://y.com/data-product/uk-bonds/port/2024-data\", \"type\": \"DataService\", \"label\": \"Data Port\", \"endpointURL\": \"https://y.com/data-product/uk-bonds/port/2024-data\", \"isAccessServiceOf\": { \"type\": \"Distribution\", \"format\": \"https://www.iana.org/assignments/media-types/application/json\", \"isDistributionOf\": { \"type\": \"Dataset\", \"id\": \"https://y.com/data-product/uk-bonds/dataset/2024-data\", \"conformsTo\": \"https://y.com/schema/Data\" } } } ] } ] }"
      - paragraph [ref=f1e856]: "Given that the schema defines the class for an observation, it can be used to find all observability ports on data product like this:"
      - code [ref=f1e858]: "[https://y.com/data-product/uk-bonds/port/2024-observability] >> isAccessServiceOf >> isDistributionOf >> conformsTo >> https://y.com/schema/ObservabilityLog"
      - paragraph [ref=f1e859]: "In Linked Data a SPARQL query would do that:"
      - code [ref=f1e861]: "SELECT ?port WHERE { ?port a dcat:DataService . ?port (dprod:isAccessServiceOf/dprod:isDistributionOf)/dcat:conformsTo rlog:Entry }"
      - paragraph [ref=f1e862]:
        - text: "This query will return the URI of the port that provides logging data:"
        - code [ref=f1e863]: https://y.com/data-product/uk-bonds/port/2024-observability
        - text: .
      - paragraph
    - generic [ref=f1e864]:
      - heading "Data Lineage" [level=3] [ref=f1e865]
      - paragraph
      - paragraph [ref=f1e866]: "It is important to be able to trace the lineage of data. Within DPROD, this can be done in two ways: at a high level from one data product to another and, if desired, at the more detailed level of the underlying datasets."
      - 'heading "High Level Lineage: Between Data Products" [level=2] [ref=f1e867]'
      - paragraph [ref=f1e868]: Data products have input and output ports, and one data product’s input port will point to another data product’s output port.
      - paragraph [ref=f1e869]: This allows a user to query the lineage. The data products all have URLs as identifiers, and properties all connect to each other, so a query can walk from one data product to the downstream data products that feed it.
      - paragraph [ref=f1e870]: "One can follow the path that leads from one data product to another like this:"
      - code [ref=f1e872]: Data Product >> inputPort >> isAccessServiceOf >> isDistributionOf >> Input Data Product
      - paragraph [ref=f1e873]: "The following example data has three data products that connect to each other through their input and output ports:"
      - code [ref=f1e875]: "{ \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"dataProducts\": [ { \"id\": \"https://y.com/data-product/company-finance\", \"type\": \"DataProduct\", \"inputPort\": [ { \"id\": \"https://y.com/data-product/company-sales/port/2025-sales\", \"type\": \"DataService\" }, { \"id\": \"https://y.com/data-product/company-hr/port/2025-payroll\", \"type\": \"DataService\" } ], \"outputPort\": { \"id\": \"https://y.com/data-product/company-sales/port/2025-balance-sheet\", \"type\": \"DataService\", \"label\": \"Balance Sheet\", \"endpointURL\": \"https://y.com/data-product/company-sales/port/2025-c\", \"isAccessServiceOf\": { \"type\": \"Distribution\", \"format\": \"https://www.iana.org/assignments/media-types/application/json\", \"isDistributionOf\": { \"type\": \"Dataset\", \"id\": \"https://y.com/data-product/company-sales/dataset/2025-balance-sheet\", \"conformsTo\": \"https://y.com/schema/BalanceSheet\" } } } }, { \"id\": \"https://y.com/data-product/company-sales\", \"type\": \"DataProduct\", \"outputPort\": { \"id\": \"https://y.com/data-product/company-sales/port/2025-sales\", \"type\": \"DataService\", \"label\": \"Sales\", \"endpointURL\": \"https://y.com/data-product/company-sales/port/2025-sales\", \"isAccessServiceOf\": { \"type\": \"Distribution\", \"format\": \"https://www.iana.org/assignments/media-types/application/json\", \"isDistributionOf\": { \"type\": \"Dataset\", \"label\": \"Sales\", \"id\": \"https://y.com/data-product/company-sales/dataset/2025-sales\", \"conformsTo\": \"https://y.com/schema/Sale\" } } } }, { \"id\": \"https://y.com/data-product/company-hr\", \"type\": \"DataProduct\", \"outputPort\": { \"id\": \"https://y.com/data-product/company-sales/port/2025-payroll\", \"type\": \"DataService\", \"label\": \"Payroll\", \"endpointURL\": \"https://y.com/data-product/company-hr/port/2025-payroll\", \"isAccessServiceOf\": { \"type\": \"Distribution\", \"format\": \"https://www.iana.org/assignments/media-types/text/csv\", \"isDistributionOf\": { \"type\": \"Dataset\", \"label\": \"Payroll\", \"id\": \"https://y.com/data-product/company-sales/dataset/2025-payroll\", \"conformsTo\": \"https://y.com/schema/Payroll\" } } } } ] }"
      - paragraph [ref=f1e876]:
        - text: Given this example data, starting at the data product
        - code [ref=f1e877]: https://y.com/data-product/company-finance
        - text: ", one could walk the relationships to find the input data products that feed it:"
      - code [ref=f1e879]: https://y.com/data-product/company-finance >> :inputPort >> :isAccessServiceOf >> :isDistributionOf >> [ https://y.com/data-product/company-sales, https://y.com/data-product/company-hr ]
      - paragraph [ref=f1e880]: "In Linked Data, this would use a query such as:"
      - code [ref=f1e882]: "PREFIX : <https://y.com/data-product/> PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> PREFIX dprod: <https://www.omg.org/spec/DPROD/dprod/> SELECT DISTINCT ?input WHERE { :company-finance dprod:inputPort ?inputPort . ?inputPort dprod:isAccessServiceOf/dprod:isDistributionOf/rdfs:label ?input . }"
      - 'heading "Detailed Level: Between Datasets" [level=3] [ref=f1e883]'
      - paragraph [ref=f1e884]: To track lineage at a more granular level, one can also use PROV (https://www.w3.org/TR/prov-o/) at the dataset level.
      - code [ref=f1e886]: "dap:atnf-P366-2003SEPT rdf:type dcat:Dataset ; dcterms:bibliographicCitation \"Burgay, M; McLaughlin, M; Kramer, M; Lyne, A; Joshi, B; Pearce, G; D'Amico, N; Possenti, A; Manchester, R; Camilo, F (2017): Parkes observations for project P366 semester 2003SEPT. v1. CSIRO. Data Collection. https://doi.org/10.4225/08/598dc08d07bb7\" ; dcterms:title \"Parkes observations for project P366 semester 2003SEPT\"@en ; dcat:landingPage <https://data.csiro.au/dap/landingpage?pid=csiro:P366-2003SEPT> ; prov:wasGeneratedBy dap:P366 ; . dap:P366 rdf:type prov:Activity ; dcterms:type <http://dbpedia.org/resource/Observation> ; prov:startedAtTime \"2000-11-01\"^^xsd:date ; prov:used dap:Parkes-radio-telescope ; prov:wasInformedBy dap:ATNF ; rdfs:label \"P366 - Parkes multibeam high-latitude pulsar survey\"@en ; rdfs:seeAlso <https://doi.org/10.1111/j.1365-2966.2006.10100.x> ; ."
      - paragraph [ref=f1e887]: "See: https://www.w3.org/TR/vocab-dcat-3/#examples-dataset-provenance."
      - paragraph
