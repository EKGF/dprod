  - generic [ref=f1e153]:
    - heading "Data Product (DPROD) Model" [level=2] [ref=f1e154]
    - paragraph [ref=f1e155]:
      - link "Data Mesh Architectures" [ref=f1e156] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/Data_mesh
      - text: "[[Data Mesh]] use input and output ports to manage how data enters and leaves a Data Product. These ports can handle different formats, schemas, and protocols. Input ports bring in data, while output ports send data to other Data Products for aggregation, reuse, analysis or reporting, etc."
    - paragraph [ref=f1e157]:
      - text: In the [[[vocab-dcat-3]]] framework, a
      - link "Data Service" [ref=f1e158] [cursor=pointer]:
        - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:DataService
      - text: is a way to describe services that provide access to data. Data Services give standardized, machine-readable descriptions of how to access one or more datasets or data processing functions.
    - paragraph [ref=f1e159]:
      - text: Data Services specify how to access and download the data. In DPROD, Data Services are connected to
      - link "Distributions" [ref=f1e160] [cursor=pointer]:
        - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Distribution
      - text: by a property called
      - link "isAccessServiceOf" [ref=f1e161] [cursor=pointer]:
        - /url: "#isaccessserviceof"
      - text: ; on the Distribution one can specify formats (like CSV or JSON etc.) and provide metadata about the "physical model" of the data. Distributions link to
      - link "Datasets" [ref=f1e162] [cursor=pointer]:
        - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Dataset
      - text: and DCAT has a very rich vocabulary for describing every aspect of a dataset. Finally, Datasets use the
      - link "conformsTo" [ref=f1e163] [cursor=pointer]:
        - /url: https://www.w3.org/TR/vocab-dcat-3/#Property:resource_conforms_to
      - text: property to link to the "logical model" where one can specify one's own rich semantic metadata.
    - paragraph [ref=f1e164]: By linking Data Product ports to DCAT DataServices ([[vocab-dcat-3]]), DPROD can describe Data Products in a way that machines can read across the organization. This makes it easier for data teams to build and manage their own data products independently, while still working well with the rest of the organization's data.
    - paragraph [ref=f1e165]: Using standards like DCAT helps create a strong and clear way to define Data Products. It ensures that as data becomes more complex, the methods for describing, sharing, and using data stay consistent and reliable. It also allows different organizations to share data securely and in a standardized way.
    - figure "Overview of the DPROD model and its relationship with DCAT classes" [ref=f1e166]:
      - img "Information model for the Profile" [ref=f1e167]
    - paragraph [ref=f1e169]: "The Profile consists of the following classes:"
    - list [ref=f1e170]:
      - listitem [ref=f1e171]:
        - text: Data Mesh (
        - code [ref=f1e172]: dcat:Catalog
        - text: ) - The collection of Data Products
      - listitem [ref=f1e173]:
        - text: Data Product (
        - code [ref=f1e174]: dprod:DataProduct
        - text: ) - A data product may have input and output ports, code and metadata
      - listitem [ref=f1e175]:
        - text: Port (
        - code [ref=f1e176]: dcat:DataService
        - text: ) - A digital interface that provides access to a Dataset. This can be an HTTP URL, a Database or a FileShare, etc.
      - listitem [ref=f1e177]:
        - text: Distribution (
        - code [ref=f1e178]: dcat:Distribution
        - text: ) - A specific representation of a dataset (CSV, JSON, ADLS etc.) which can conform to a physical model
      - listitem [ref=f1e179]:
        - text: Dataset (
        - code [ref=f1e180]: dcat:Dataset
        - text: ) - A collection of related data that can conform to a logical model
    - paragraph
    - paragraph [ref=f1e181]:
      - text: As
      - link "DCAT Data Services" [ref=f1e182] [cursor=pointer]:
        - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Data_Service
      - text: ", the DPROD"
      - link "input" [ref=f1e183] [cursor=pointer]:
        - /url: "#inputport"
      - text: and
      - link "output" [ref=f1e184] [cursor=pointer]:
        - /url: "#outputport"
      - text: ports can specify connection details, they have
      - link "distributions" [ref=f1e185] [cursor=pointer]:
        - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Distribution
      - text: that define formats, and link to
      - link "datasets" [ref=f1e186] [cursor=pointer]:
        - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Dataset
      - text: that conform to shared schemas. In this example, the UK Bonds Data Product includes an output port, which is a RESTful API. This API delivers JSON data conforming to the shared FIBO specification for callable bonds.
    - generic [ref=f1e187]: "{ \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"id\": \"https://y.com/products/uk-bonds\", \"type\": \"DataProduct\", \"title\": \"UK Bonds\", \"description\": \"UK Bonds is your one-stop-shop for all your bonds!\", \"dataProductOwner\": \"https://www.linkedin.com/in/tonyseale/\", \"lifecycleStatus\" : \"https://www.omg.org/spec/DPROD/data/lifecycle-status/Consume\", \"outputPort\": { \"type\": \"DataService\", \"endpointURL\": \"https://y.com/uk-10-year-bonds\", \"isAccessServiceOf\": { \"type\": \"Distribution\", \"format\": \"https://www.iana.org/assignments/media-types/application/json\", \"isDistributionOf\": { \"type\": \"Dataset\", \"id\": \"https://y.com/products/uk-bonds/datasets/10-year\", \"conformsTo\": \"https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CallableBond\" } } } }"
    - paragraph [ref=f1e188]:
      - text: The examples map the type of the above classes to
      - code [ref=f1e189]: "@type"
      - text: in the JSON-LD serializations. One can use JSON-LD to extend the familiar JSON syntax with the shared semantics defined by DCAT and DPROD. The JSON above can be pasted into
      - link "https://json-ld.org/playground" [ref=f1e190] [cursor=pointer]:
        - /url: https://json-ld.org/playground/
      - text: . One can see that the schema resolves.
    - paragraph [ref=f1e191]: The following sections are driven by the Shapes definitions for DPROD, which represent the properties expected to be used for instances of the above classes. As such, they include properties defined by the DCAT specification which DPROD extends. The prefix in the identifier for each entry indicates the ontology defining the property.
    - generic [ref=f1e192]:
