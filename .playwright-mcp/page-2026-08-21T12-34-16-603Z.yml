        - heading "inputPort" [level=4] [ref=f1e279]
        - paragraph [ref=f1e280]: A set of services exposed by a data product to collect its source data and makes it available for further internal transformation. An input port can receive data from one or more upstream sources in a push (i.e. asynchronous subscription) or pop mode (i.e. synchronous query). Each data product may have one or more input ports.
