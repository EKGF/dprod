        - listitem [ref=f1e776]: "2nd port: providing only EMEA rates through an api"
        - listitem [ref=f1e777]: "3rd port: providing only US rates through a Kafka topic"
      - paragraph
      - code [ref=f1e779]: "{ \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"id\": \"sba-pool-rates\", \"@id\": \"https://y.com/products/sba-pool-rates\", \"@type\": \"DataProduct\", \"title\": \"SBA Pool Rates\", \"description\": \"Rates for SBA Pool that are Mortgage Backed Securities. The data product is provided through 3 ports, one of them proving all SBA pool rates through a query to a database, another port providing EMEA only rates through an api and another one providing US only rates through a Kafka topic\", \"dataProductOwner\": \"https://www.schema.xxx/person/johnSmith\", \"lifecycle\" : \"Consume\", \"outputPort\": [{ \"@type\": \"dcat:DataService\", \"id\": \"sba-pool-rate-tabular-prod1\", \"environment\": \"PROD\", \"@id\": \"https://y.com/service/sba-pool-rate-tabular-prod1\", \"dcat:endpointURL\": \"jdbc:oracle:thin@sd656-5656-6745.ldn.organiation.com:43534/PGPERG.WORLD\", \"sql\": \"select * from ...\", \"isAccessServiceOf\": { \"@id\": \"https://y.com/distribution/sba-pool-rate-tabular\", \"id\": \"sba-pool-rate-tabular\", \"@type\": \"dcat:Distribution\", \"dcterms:format\": \"https://www.iana.org/assignments/media-types/application/sql\", \"isDistributionOf\": { \"@type\": \"dcat:Dataset\", \"@id\": \"https://y.com/dataset/sba-pool-rate\", \"id\": \"sba-pool-rate\", \"dcat:conformsTo\": \"https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/MortgageBackedSecurities/SBA-Pool\" } } } , { \"@type\": \"dcat:DataService\", \"id\": \"sba-pool-rate-emea-api-prod1\", \"environment\": \"PROD\", \"@id\": \"https://y.com/service/sba-pool-rate-emea-api-prod1\", \"dcat:endpointURL\": \"https://example.org/mbs/SBA-Pool-location-emea\", \"dcat:conformsTo\": \"../resources/users.yaml'\" , \"isAccessServiceOf\": { \"@id\": \"https://y.com/distribution/sba-pool-rate-emea-json1\", \"id\": \"sba-pool-rate-emea-json1\", \"@type\": \"dcat:Distribution\", \"dcterms:format\": \"https://www.iana.org/assignments/media-types/application/json\", \"isDistributionOf\": { \"@type\": \"dcat:Dataset\", \"@id\": \"https://y.com/dataset/sba-pool-rate-emea\", \"description\": \"SBA pool data that cover EMEA accessed through an api\" , \"geographicalCoverage\" :\"https://y.com/country/EMEA\", \"id\": \"sba-pool-rate-emea\", \"dcat:conformsTo\": \"https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/MortgageBackedSecurities/SBA-Pool\" } } } , { \"@type\": \"dcat:DataService\", \"id\": \"sba-pool-rate-json-prod1\", \"@id\": \"https://y.com/service/sba-pool-rate-json-prod1\", \"dcat:endpointURL\": \"q1.debt.mbs.dataset.us\", \"isAccessServiceOf\": { \"@id\": \"https://y.com/distribution/sba-pool-rate-json\", \"id\": \"sba-pool-rate-json\", \"@type\": \"dcat:Distribution\", \"dcterms:format\": \"https://www.iana.org/assignments/media-types/application/json\", \"conformsTo\": \"http://confluent-registry-y/rates-json-schema.json\", \"schemaCompatiblity\": \"backwards compatible\", \"isDistributionOf\": { \"@type\": \"dcat:Dataset\", \"@id\": \"https://y.com/dataset/sba-pool-rate-us\", \"id\": \"sba-pool-rate-us\", \"geographicalCoverage\" :\"https://y.com/country/US\", \"dcat:conformsTo\": \"https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/MortgageBackedSecurities/SBA-Pool\" } } } ] }"
    - generic [ref=f1e780]:
      - heading "Core Data Product Extensions" [level=3] [ref=f1e781]
      - paragraph
      - paragraph [ref=f1e782]: For real world data products, the core data product details will be part of a wider set of metadata that allows the data and data product to be used effectively.
      - paragraph [ref=f1e783]: Below is an example of extending the DPROD data product, specifically by adding an agreement to a data product.
      - paragraph [ref=f1e784]: In this example, a Data Product Agreement is defined as a subclass of FIBO Agreement.
      - paragraph [ref=f1e785]:
        - emphasis [ref=f1e786]: "Definition of a simple Agreement based on FIBO:"
      - code [ref=f1e788]: "[ { \"@context\": [ \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", { \"fibo\": \"http://spec.edmcouncil.org/fibo/ontology/FND/Agreements/MetadataFNDAgreements/#\", \"ex\": \"http://example.org/dp#\" } ], \"@id\": \"ex:isSubjectToAgreement\", \"@type\": \"rdf:Property\", \"rdfs:label\": \"Data Product is Subject To FIBO Agreement\", \"rdfs:domain\": { \"@id\": \"DataProduct\" }, \"rdfs:range\": { \"@id\": \"DataProductAgreement\" } }, { \"@id\": \"ex:DataProductAgreement\", \"@type\": \"rdfs:class\", \"rdfs:label\": \"DataProductAgreement\", \"rdfs:subClassOf\": { \"@id\": \"fibo:Agreement\" } } ]"
      - paragraph [ref=f1e789]: A full definition of agreements for data products is likely to be more complex than a single class and may use other information models or their profiles (such as ODRL Policy) or create dedicated definitions.
      - paragraph [ref=f1e790]: Below is an example of a Data Product with an associated Data Product Agreement with an effective date.
      - paragraph [ref=f1e791]:
        - emphasis [ref=f1e792]: "Using the agreement:"
      - code [ref=f1e794]: "{ \"@context\": [ \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", { \"fibo\": \"http://spec.edmcouncil.org/fibo/ontology/FND/Agreements/MetadataFNDAgreements/#\", \"ex\": \"http://example.org/dp#\" } ], \"dataProducts\": [ { \"id\": \"https://y.com/data-product/company-sales\", \"type\": \"DataProduct\", \"outputPort\": { \"id\": \"https://y.com/data-product/company-sales/port/2025-sales\", \"type\": \"DataService\", \"label\": \"Sales\", \"endpointURL\": \"https://y.com/data-product/company-sales/port/2025-sales\", \"isAccessServiceOf\": { \"type\": \"Distribution\", \"format\": \"https://www.iana.org/assignments/media-types/application/json\", \"isDistributionOf\": { \"type\": \"Dataset\", \"label\": \"Sales\", \"id\": \"https://y.com/data-product/company-sales/dataset/2025-sales\", \"conformsTo\": \"https://y.com/schema/Sale\" } } }, \"ex:iSubjectToAgreement\": { \"@id\": \"ex:VVSimpleAgreement\", \"@type\": \"ex:DataProductagreement\" } } ], \"agreements\": [ { \"@id\": \"ex:VVSimpleAgreement\", \"@type\": \"ex:DataProductAgreement\", \"rdfs:label\": \"Very Simple Data Product Agreement\", \"fibo:hasEffectiveDate\": { \"@type\": \"xsd:date\", \"@value\": \"2024-08-31\" } } ] }"
      - paragraph
    - generic [ref=f1e795]:
      - heading "Data Schema" [level=3] [ref=f1e796]
      - paragraph
      - paragraph [ref=f1e797]:
        - text: The Data Product provides to the consumers (dprod:outputDataset) datasets defined based on
        - link "DCAT" [ref=f1e798] [cursor=pointer]:
          - /url: https://www.w3.org/TR/vocab-dcat-3/
        - text: . Datasets should be described (
        - link "dcat:conforms" [ref=f1e799] [cursor=pointer]:
          - /url: https://www.w3.org/TR/vocab-dcat-2/#Property:resource_conforms_to
        - text: ) with logical models. Logical models describe business entities and their properties (attributes and relationships) with consistent business terms and they are technology independent. Ideally, logical models are based on existing standards eg,
        - link "FIBO" [ref=f1e800] [cursor=pointer]:
          - /url: https://spec.edmcouncil.org/fibo/ontology
        - text: ","
        - link "CDM" [ref=f1e801] [cursor=pointer]:
          - /url: https://www.finos.org/common-domain-model
        - text: "etc. If a logical model does not exist to describe the dataset, then the dataset publisher can create one, preferably by using SHACL modelling language:"
      - paragraph [ref=f1e802]: "Example of a Dataset conforming to a SHACL Schema:"
      - code [ref=f1e804]: exampleDataset dcat:conforms exampleSchema:DatasetLogicalSchema. exampleSchema:DatasetLogicalSchema a owl:Ontology, dct:Standard.
      - paragraph [ref=f1e805]:
        - text: Based on
        - link "SHACL" [ref=f1e806] [cursor=pointer]:
          - /url: https://www.w3.org/TR/shacl/
        - text: all entities that exist in the dataset are Node Shapes (1). The attributes of the entities are described as Property Shapes with sh:datatype (2) The relationships are also defined as Property Shaped with sh:class the target class of the relationship (3)
      - code [ref=f1e808]: "# definition of the entity as a Node Shape (1) example:Account a sh:NodeShape ; # human readable name of the entity rdfs:label \"Account\"@en ; # description of the entity dc:description \"An Account is...\" ; # an account has a property shape Account Age. # Definition of the property shape follows (2) sh:property example:Account-AccountAge ; # an account has a property shape Account Branch. # Definition of the property shape follows (3) sh:property example:Account-AccountBranch ; rdfs:isDefinedBy exampleSchema:DatasetLogicalSchema; . # (2) Definition of the Account-AccountAge property shape # describing that an account MUST have exactly one # AccountAge attribute and its datatype is integer example:Account-AccountAge a sh:PropertyShape ; sh:path example:AccountAge ; sh:datatype xsd:integer ; sh:minCount 1 ; sh:maxCount 1 ; rdfs:isDefinedBy exampleSchema:DatasetLogicalSchema ; . # (3) Definition of the Account-AccountBranch property shape # describing than an account must have at least one # Account Branch which is another entity example:Account-AccountBranch a sh:PropertyShape ; sh:path example:AccountBranch ; sh:class example:Branch ; sh:minCount 1 ; rdfs:isDefinedBy exampleSchema:DatasetLogicalSchema ; . # definition of the entity Branch as a Node Shape (1) example:Branch a sh:NodeShape ; rdfs:label \"Branch\"@en ; dc:description \"A Branch is..\" ; rdfs:isDefinedBy exampleSchema:DatasetLogicalSchema ; ."
      - paragraph
      - code [ref=f1e810]: "{ \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"id\": \"https://y.com/products/equity-trade-xxx\", \"@type\": \"DataProduct\", \"title\": \"Equity Trade XXX\", \"description\": \"Trade data defining the outcome of equity trades between parties in different stock markets, where the terms are primarily reflected in the tradable product. Additionally, Trade includes attributes such as the trade date, transacting parties, and settlement terms. Some attributes, such as the parties, are already defined in the Party Product and are simply referenced in Trade\", \"outputPort\": { \"@type\": \"DataService\", \"endpointURL\": \"abfss://datasetsv1@demo.dfs.core.windows.net/demo/full/trade-euronext\", \"isAccessServiceOf\": { \"@type\": \"Distribution\", \"format\": \"application/parquet\", \"isDistributionOf\": { \"@type\": \"Dataset\", \"@id\": \"https://y.com/dataset/equity-trade-euronext-paris\", \"title\": \"Equity Trade Euronext Paris XXX\", \"conformsTo\":\"https://spec.edmcouncil.org/fibo/ontology/BP/Process/FinancialContextAndProcess/SecuritiesTrade\" } } } }"
    - generic [ref=f1e811]:
      - heading "Data Quality" [level=3] [ref=f1e812]
      - paragraph
      - list [ref=f1e813]:
        - listitem [ref=f1e814]:
          - link "DQV" [ref=f1e815] [cursor=pointer]:
            - /url: https://www.w3.org/TR/vocab-dqv/
          - text: is a standard vocabulary to describe data quality and is proposed along with the DCAT vocabulary to measure the quality of datasets.
        - listitem [ref=f1e816]: "It is based on 3 basic entities: Dimensions, the Metrics that belong to its dimension, and the Measurement for each metric."
        - listitem [ref=f1e817]: Data Quality can be computed at different levels, eg. data product, dataset, table, column level etc.
        - listitem [ref=f1e818]: Usually, data quality metrics are measured at a dataset level and can inform more higher-level quality metrics at a data product level.
      - paragraph
      - code [ref=f1e820]: "[ { \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"id\": \"https://y.com/derived-quality-measurementA\", \"@type\": \"QualityMeasurement\", \"value\": 1, \"computedOn\": { \"@type\": \"DataProduct\", \"@id\": \"https://y.com/products/uk-bonds\" }, \"isMeasurementOf\": { \"@type\": \"Metric\", \"label\": \"Number of stale datasets\" } } , { \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"@id\": \"https://y.com/quality-measurement-B\", \"@type\": \"QualityMeasurement\", \"value\": \"false\", \"computedOn\": { \"@type\": \"Dataset\", \"@id\": \"https://y.com/products/uk-bonds/yearlyPrices\" }, \"isMeasurementOf\": { \"@type\": \"Metric\", \"label\": \"Expected distribution frequency achieved\" } } , { \"@context\": \"https://ekgf.org/dprod/spec/archive/1.0/dprod.jsonld\", \"id\": \"https://y.com/products/uk-bonds\", \"type\": \"DataProduct\", \"outputPort\": { \"type\": \"DataService\", \"endpointURL\": \"https://y.com/uk-bonds/quality-report\", \"isAccessServiceOf\": { \"type\": \"Distribution\", \"isDistributionOf\": { \"type\": \"Dataset\", \"conformsTo\": \"https://www.w3.org/TR/vocab-dqv/#dqv:QualityMeasurement\" } } } } ]"
