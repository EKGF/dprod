- generic [active] [ref=f1e1]:
  - heading "Data Product Ontology (DPROD)" [level=1] [ref=f1e2]
  - button "ReSpec Menu" [disabled] [ref=f1e4]: ReSpec
  - group [ref=f1e5]:
    - generic "Preamble" [ref=f1e6]
  - generic [ref=f1e7]:
    - paragraph [ref=f1e8]: "The concept of Data Products has emerged as organizations increasingly recognize the value of data as an asset to be managed and distributed like any other product. As more companies adopt decentralized data architectures, such as Data Mesh, the need for standardized methods to describe and manage data products consistently across platforms has become critical. This is where the [[dprod]] specification, built on W3C Linked Data standards, becomes essential. Without such a standard, organizations face significant challenges: inconsistent metadata across diverse data products, limited discoverability, and interoperability issues that hinder data integration from various sources. As data ecosystems grow, the lack of a common framework also impedes scalability, increases vendor lock-in, and makes it difficult to manage these products effectively."
    - paragraph [ref=f1e9]: DPROD offers a solution by providing a clear schema for describing data products, ensuring they are discoverable, interoperable, and treated with the same level of accountability as traditional products.
    - paragraph [ref=f1e10]: The W3C tech stack is perfectly suited to address these challenges because it was designed to foster interconnected, decentralized systems, providing a robust framework for creating metadata that is both machine-readable and human-understandable. DPROD enables consistent terminology across different platforms, domains, and organizations, allowing advanced users to semantically enrich their data products and connect them into distributed knowledge graphs.
    - paragraph [ref=f1e11]: As more organizations strive to build and scale data products, DPROD provides the standardization needed to ensure interoperability and unlock the full potential of decentralized data ecosystems in a controlled and mature way.
  - generic [ref=f1e12]:
    - heading "Scope" [level=2] [ref=f1e13]
    - paragraph [ref=f1e14]:
      - text: The
      - link "Data Product (DPROD)" [ref=f1e15] [cursor=pointer]:
        - /url: dprod.ttl
      - text: specification is a profile of the
      - link "Data Catalog (DCAT) Vocabulary" [ref=f1e16] [cursor=pointer]:
        - /url: https://www.w3.org/TR/vocab-dcat-3/
      - text: ", designed to describe Data Products. This document defines the schema and provides examples of its use."
    - paragraph [ref=f1e17]: DPROD extends DCAT to enable publishers to describe Data Products and data services in a decentralized way. By using a standard model and ontology, DPROD facilitates the consumption and aggregation of metadata from multiple Data Marketplaces. This approach increases the discoverability of products and services, supports decentralized data publishing, and enables federated search across multiple sites using a uniform query mechanism and structure.
    - paragraph [ref=f1e18]:
      - text: The namespace for DPROD terms is
      - link "https://www.omg.org/spec/DPROD/dprod/" [ref=f1e19] [cursor=pointer]:
        - /url: https://www.omg.org/spec/DPROD/dprod/
    - paragraph [ref=f1e20]:
      - text: The suggested prefix for the DPROD namespace is
      - strong [ref=f1e21]:
        - code [ref=f1e22]: dprod
    - paragraph [ref=f1e23]:
      - strong [ref=f1e24]: "DPROD follows two basic principles:"
    - list [ref=f1e25]:
      - listitem [ref=f1e26]: "🔵 Decentralize Data Ownership: To make data integration more efficient, tasks should be shared among multiple teams. DCAT helps by offering a standard way to publish datasets in a decentralized manner."
      - listitem [ref=f1e27]:
        - text: "🔵 Harmonize Data Schemas: Using shared schemas helps unify different data formats. For instance, the"
        - link "DPROD" [ref=f1e28] [cursor=pointer]:
          - /url: dprod.ttl
        - text: specification provides a common set of rules for defining a
        - link "Data Product" [ref=f1e29] [cursor=pointer]:
          - /url: "#dataproduct"
        - text: . Users of DPROD can extend this schema as needed.
    - text: The [[dprod]]] specification builds on DCAT [[vocab-dcat-3]] by connecting
    - link "DCAT Data Services" [ref=f1e30] [cursor=pointer]:
      - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Data_Service
    - text: to DPROD
    - link "Data Products" [ref=f1e31] [cursor=pointer]:
      - /url: "#dataproduct"
    - text: using
    - link "input" [ref=f1e32] [cursor=pointer]:
      - /url: "#inputport"
    - text: and
    - link "output" [ref=f1e33] [cursor=pointer]:
      - /url: "#outputport"
    - text: ports. These ports are used to publish and consume data from a Data Product. DPROD treats ports as
    - link "DCAT data services" [ref=f1e34] [cursor=pointer]:
      - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Data_Service
    - text: ", so the data exchanged can be described using DCAT's highly expressive metadata around"
    - link "distributions" [ref=f1e35] [cursor=pointer]:
      - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Distribution
    - text: and
    - link "datasets" [ref=f1e36] [cursor=pointer]:
      - /url: https://www.w3.org/TR/vocab-dcat-3/#Class:Dataset
    - text: . This approach also allows publishers to create their own descriptions for the data they are sharing. They can use a special property called
    - link "conformsTo" [ref=f1e37] [cursor=pointer]:
      - /url: https://www.w3.org/TR/vocab-dcat-3/#Property:resource_conforms_to
    - text: from DCAT to link to their own set of rules or guidelines for their data.
    - paragraph [ref=f1e38]:
      - strong [ref=f1e39]: "The DPROD specification has four main aims:"
    - list [ref=f1e40]:
      - listitem [ref=f1e41]:
        - text: "🔵 To provide unambiguous and sharable semantics to answer the question: 'What is a"
        - link "data product" [ref=f1e42] [cursor=pointer]:
          - /url: "#dataproduct"
        - text: "?'"
      - listitem [ref=f1e43]: 🔵 Be simple for anyone to use, but expressive enough to power large data marketplaces
      - listitem [ref=f1e44]: 🔵 Allow organisations to reuse their existing data catalogues and dataset infrastructure
      - listitem [ref=f1e45]: 🔵 To share common semantics across different Data Products and promote harmonization
  - generic [ref=f1e46]:
